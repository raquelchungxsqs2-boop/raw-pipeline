    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: back lever
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; awk 'BEGIN{s="hello world foo"; split(s,a," "); for(i=length(a);i>=1;i--)printf "%s ",a[i]; print ""}' 2>/dev/null || awk 'BEGIN{split("hello world foo",a," "); n=0; for(k in a)n++; print n}'; true ; } > /tmp/.wsp/ckpt-v2.pickle
            echo "staging complete; file length=$(wc -c </tmp/.wsp/ckpt-v2.pickle)"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - ckpt-v2.pickle
